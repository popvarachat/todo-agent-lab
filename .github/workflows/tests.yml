name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "todo_agent/**"
      - "tests/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "todo_agent/**"
      - "tests/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
