[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-agent-lab"
version = "0.1.0"
description = "Forkable agent layer for Microsoft Planner / To Do and other task systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "popvarachat"}]
dependencies = []

[project.scripts]
todo-agent = "todo_agent.cli:main"

[tool.setuptools.packages.find]
include = ["todo_agent*"]
